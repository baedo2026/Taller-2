services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taller_backend}
      POSTGRES_USER: ${POSTGRES_USER:-taller_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taller_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taller_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - taller_backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taller_user}:${POSTGRES_PASSWORD:-taller_password}@db:5432/${POSTGRES_DB:-taller_backend}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - taller_backend

volumes:
  postgres_data:

networks:
  taller_backend:
    driver: bridge