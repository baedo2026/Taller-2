version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uct-network

  # Administrador visual
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - uct-network

# Volumen persistente y red compartida (Requisitos de rúbrica)
volumes:
  postgres_data: 

networks:
  uct-network: